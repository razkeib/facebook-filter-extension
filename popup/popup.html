<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filter Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>FB Stealth Filter</h2>
  </div>

  <div class="control-group">
    <div class="switch-container">
        <span class="label-text">Extension Active</span>
        <label class="switch">
          <input type="checkbox" id="sniff-toggle">
          <span class="slider"></span>
        </label>
    </div>
    <p class="helper-text">Turn off to completely disable post capture and detach debugger.</p>

    <div class="switch-container" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
        <span class="label-text">Sniff Groups Only</span>
        <label class="switch">
          <input type="checkbox" id="groups-only-toggle">
          <span class="slider"></span>
        </label>
    </div>
    <p class="helper-text">Only capture posts when directly viewing a top-level group page.</p>
  </div>

  <div class="control-group">
    <label for="exclude-keywords" class="label-text">Exclude Keywords</label>
    <p class="helper-text">Comma-separated words. Posts containing these will be ignored.</p>
    <textarea id="exclude-keywords" rows="3" placeholder="e.g. sponsored, politics, ad"></textarea>
  </div>

  <button id="btn-dashboard" class="btn-primary">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
